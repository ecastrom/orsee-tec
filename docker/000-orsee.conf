<VirtualHost *:80>
    # ORSEE lives in the orsee/ subdirectory of the repo.
    DocumentRoot /var/www/html/orsee

    <Directory /var/www/html/orsee>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Never serve the SQL dump / install notes, or the PHP libraries directly.
    <Directory /var/www/html/orsee/install>
        Require all denied
    </Directory>
    <Directory /var/www/html/orsee/config>
        Require all denied
    </Directory>
    <Directory /var/www/html/orsee/tagsets>
        Require all denied
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/orsee_error.log
    CustomLog ${APACHE_LOG_DIR}/orsee_access.log combined
</VirtualHost>
