# Apache vhost include for ORSEE on Heroku (loaded via Procfile: -C heroku/apache2.conf).
# The document root is orsee/ (the last argument to heroku-php-apache2), so URL "/"
# maps to orsee/. We deny direct HTTP access to paths that must never be served as
# files. PHP `require`/`include` from index.php are filesystem reads and are NOT
# affected by these URL rules, so the app keeps working.
#
# Location matches on the request URL (root-independent), which is more robust here
# than <Directory> (whose relative paths resolve against ServerRoot, not the docroot).

# Heroku's PHP buildpack ships DirectoryIndex = index.html only. ORSEE serves its
# entry points as index.php (site root, /admin/, /public/, ...), so without this a
# directory request never finds index.html and then 403s (Indexes are off below).
DirectoryIndex index.php index.html

# Never serve the SQL dump, install notes, licence or changelog.
<Location "/install/">
    Require all denied
</Location>

# config/ is PHP libraries only (settings.php etc.) — no web assets live here.
<Location "/config/">
    Require all denied
</Location>

# tagsets/ is mixed: server-side PHP libraries AND web assets that the public and
# admin pages load (css/, fonts/, js/, images). Deny direct access to the PHP
# libraries only; the static assets MUST stay servable or the UI renders unstyled
# (framework CSS from tagsets/css/ is what hides the modal/popup templates).
<LocationMatch "^/tagsets/.*\.php$">
    Require all denied
</LocationMatch>

# Hide dotfiles (e.g. the vendored version marker).
<FilesMatch "^\.">
    Require all denied
</FilesMatch>

# No directory listings.
<Location "/">
    Options -Indexes
</Location>
